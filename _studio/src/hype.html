<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>body{width:1280px;height:720px}.c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0}

</style><body><div class="amb" id="amb"></div><div class="scan"></div>
<div class="c" id="s1"><div><div class="h">Every memecoin<br>is <span class="iri">brainless.</span></div></div></div>
<div class="c" id="s2"><div><div class="h">Give yours a <span class="iri">treasury,</span><br>a brain and a desk.</div></div></div>
<div class="c" id="s3"><div id="mon"><div class="t">WARD · LIVE EQUITY · ALL AGENTS</div><div id="bb">BUYBACK · 0.000 SOL</div><canvas id="cv" width="1100" height="380"></canvas><div id="leg"></div></div></div>
<div class="c" id="s4"><div><div class="big" id="pct">+0.0%</div><div class="sub">PROFIT BUYS THE COIN BACK. EVERY NEW HIGH.</div></div></div>

<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>1-Math.pow(1-cl(x),3),win=(t,a,b,f=.22)=>cl((t-a)/f)*cl((b-t)/f);
const AG=[['BRN','Momentum','#14f195',1.3],['DIP','Reversion','#9945ff',2.9],['TRND','Trend','#c7b3ff',4.1],['DGN','Degen','#ffb36b',5.6],['HDG','Hedge','#ffe27b',7.2],['VOL','Vol hunter','#5ad8ff',8.4]];
$('leg').innerHTML=AG.map((a)=>`<span><i style="background:${a[2]}"></i>${a[0]} · ${a[1]}</span>`).join('');
const path=(seed,n)=>{const p=[];let y=100;for(let i=0;i<=n;i++){y+=(Math.sin(i/9+seed)*.6+Math.sin(i/23+seed*2)*.4)*1.6+ .18;p.push(y);}return p;};
const P=AG.map((a)=>path(a[3],120));
function draw(prog){const g=$('cv').getContext('2d');g.clearRect(0,0,1100,380);const lo=88,hi=132;g.setLineDash([3,5]);g.strokeStyle='#2e2646';g.beginPath();const y0=380-(100-lo)/(hi-lo)*380;g.moveTo(0,y0);g.lineTo(1100,y0);g.stroke();g.setLineDash([]);
 AG.forEach((a,i)=>{const n=Math.floor(prog*120);g.strokeStyle=a[2];g.lineWidth=2.2;g.shadowColor=a[2];g.shadowBlur=10;g.beginPath();for(let k=0;k<=n;k++){const x=k/120*1080+10,y=380-(P[i][k]-lo)/(hi-lo)*380;k?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();g.shadowBlur=0;if(n>0){const x=n/120*1080+10,y=380-(P[i][n]-lo)/(hi-lo)*380;g.fillStyle=a[2];g.beginPath();g.arc(x,y,3.5,0,7);g.fill();}});}
window.__seek=(t)=>{
  $('amb').style.transform=`rotate(${t*4}deg) scale(${1+t*.02})`;
  $('s1').style.opacity=win(t,0,1.9);$('s1').firstElementChild.style.transform=`translateY(${(1-e(t/.6))*30}px)`;
  $('s2').style.opacity=win(t,1.8,3.7);$('s2').firstElementChild.style.transform=`scale(${.94+e((t-1.8)/.7)*.06})`;
  $('s3').style.opacity=win(t,3.6,6.9);const p=e((t-3.8)/2.6);draw(p);$('bb').textContent='BUYBACK · '+(p*0.418).toFixed(3)+' SOL';
  $('s4').style.opacity=win(t,6.8,8.4);$('pct').textContent='+'+(e((t-6.9)/1)*38.4).toFixed(1)+'%';
  $('s5').style.opacity=e((t-8.3)/.5);$('s5').firstElementChild.style.transform=`scale(${.9+e((t-8.3)/.8)*.1})`;
};window.__seek(0);
</script>
